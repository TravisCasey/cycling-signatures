name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    name: format
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    name: clippy
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cycling_signatures --all-targets -- -D warnings
      - run: cargo clippy -p cycling-signatures-py --all-targets -- -D warnings

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        os:
          - ubuntu-latest
          - macos-latest
    name: tests/${{ matrix.rust }}/${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: none
            flags: "--document-private-items"
          - name: serde
            flags: "--document-private-items --features serde"
          - name: all
            flags: "--all-features"
    name: docs/${{ matrix.name }}
    env:
      RUSTDOCFLAGS: "-Dwarnings --cfg docsrs"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install MPI and libclang
        if: matrix.name == 'all'
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev libclang-dev
      - run: cargo doc --no-deps ${{ matrix.flags }}

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: serde
            flags: "--features serde"
            lint: true
          - name: rayon
            flags: "--features rayon"
            lint: false
    name: features/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.lint
        run: cargo clippy -p cycling_signatures --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo test ${{ matrix.flags }}

  mpi:
    runs-on: ubuntu-latest
    name: mpi
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MPI and libclang
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev libclang-dev
      - run: cargo check --features mpi

  msrv:
    runs-on: ubuntu-latest
    name: msrv
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    name: deny
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  machete:
    runs-on: ubuntu-latest
    name: machete
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  spellcheck:
    runs-on: ubuntu-latest
    name: spellcheck
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-spellcheck@0.15.5
      - run: cargo spellcheck check -m 1

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    name: python/${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run maturin develop --release
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run --group examples ty check
      - run: uv run codespell cycling_signatures tests
      - run: uv run pytest
      - name: Cache example data
        if: matrix.python-version == '3.14'
        uses: actions/cache@v4
        with:
          path: |
            python/examples/lorenz/data
            python/examples/dadras/data
          key: example-data-${{ hashFiles('python/examples/_support.py') }}
      - if: matrix.python-version == '3.14'
        run: uv run --group docs --group examples sphinx-build -E -W -b html docs docs/_build/html

  success:
    name: Success
    runs-on: ubuntu-latest
    needs:
      [
        format,
        clippy,
        tests,
        docs,
        features,
        mpi,
        msrv,
        deny,
        machete,
        spellcheck,
        python,
      ]
    if: always()
    steps:
      - name: check if any dependency failed
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
