name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  format:
    runs-on: ubuntu-latest
    name: format
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    name: clippy
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        os:
          - ubuntu-latest
          - macos-latest
    name: tests/${{ matrix.rust }}/${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # The rayon and mpi features gate no source in this crate; they only select a
  # chomp3rs execution backend. Documenting without serde and with it therefore
  # covers every configuration rustdoc can distinguish.
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: none
            flags: ""
          - name: serde
            flags: "--features serde"
    name: docs/${{ matrix.name }}
    env:
      RUSTDOCFLAGS: "-Dwarnings --cfg docsrs"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items ${{ matrix.flags }}

  # The format, clippy, and tests jobs cover the featureless build. These are
  # the remaining feature selections that reach a distinct compilation or a
  # distinct backend. An mpi row is deliberately absent: it needs a system MPI
  # implementation and compiles the same source as serde.
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: serde
            flags: "--features serde"
          - name: rayon
            flags: "--features rayon"
    name: features/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets ${{ matrix.flags }}
      - run: cargo test ${{ matrix.flags }}

  deny:
    runs-on: ubuntu-latest
    name: deny
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  machete:
    runs-on: ubuntu-latest
    name: machete
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  spellcheck:
    runs-on: ubuntu-latest
    name: spellcheck
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-spellcheck@0.15.5
      - run: cargo spellcheck check -m 1

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    name: python/${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run maturin develop --release
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run --group examples ty check
      - run: uv run codespell cycling_signatures tests
      - run: uv run pytest
      - name: Cache example data
        if: matrix.python-version == '3.14'
        uses: actions/cache@v4
        with:
          path: |
            python/examples/lorenz/data
            python/examples/dadras/data
          key: example-data-${{ hashFiles('python/examples/_support.py') }}
      - if: matrix.python-version == '3.14'
        run: uv run --group docs --group examples sphinx-build -E -W -b html docs docs/_build/html

  success:
    name: Success
    runs-on: ubuntu-latest
    needs:
      [format, clippy, tests, docs, features, deny, machete, spellcheck, python]
    if: always()
    steps:
      - name: check if any dependency failed
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
