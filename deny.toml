[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

# gmp-mpfr-sys (transitive via chomp3rs -> flint-sys) declares its license
# as the deprecated SPDX form "LGPL-3.0+". Clarify it to the modern
# equivalent so cargo-deny does not warn on the deprecated identifier.
[[licenses.clarify]]
crate = "gmp-mpfr-sys"
expression = "LGPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "deny"
wildcards = "warn"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/TravisCasey/CHomP3-rs.git"]
