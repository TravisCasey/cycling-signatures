[package]
name = "cycling_signatures"
version = "0.1.0"
authors = ["Travis Casey"]
edition = "2024"
description = "Algebraic topological descriptions of recurrent motions in high-dimensional dynamical systems"
readme = "README.md"
repository = "https://github.com/TravisCasey/cycling-signatures"
license = "GPL-3.0-or-later"
keywords = ["homology", "topology", "dynamical systems"]
categories = ["mathematics"]
resolver = "3"

[dependencies]
chomp3rs = { git = "https://github.com/TravisCasey/CHomP3-rs.git", rev = "455eb70", version = "0.3.12", default-features = false }
ndarray = { workspace = true }
ndarray-npy = { version = "0.10.0", optional = true, default-features = false }
rmp-serde = { version = "1", optional = true }
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
len_without_is_empty = "allow"
unreadable_literal = "allow"

[features]
serde = ["dep:serde", "chomp3rs/serde", "dep:rmp-serde", "dep:ndarray-npy"]
rayon = ["chomp3rs/rayon"]
mpi = ["chomp3rs/mpi", "serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["python"]

[workspace.dependencies]
ndarray = "0.17.2"
