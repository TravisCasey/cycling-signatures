[package]
name = "cycling_signatures"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Algebraic topological descriptions of recurrent motions in high-dimensional dynamical systems."
readme = "README.md"
repository = "https://github.com/TravisCasey/cycling-signatures"
license.workspace = true
keywords = ["homology", "topology", "dynamical systems"]
categories = ["mathematics"]
resolver = "3"

[dependencies]
chomp3rs = { git = "https://github.com/TravisCasey/CHomP3-rs.git", rev = "81d1d1451c5281cf72479030594887b191fd279e", version = "0.3.12", default-features = false }
ndarray = { workspace = true }
ndarray-npy = { version = "0.10.0", optional = true, default-features = false }
rmp-serde = { version = "1", optional = true }
rustc-hash = { workspace = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"

[lints]
workspace = true

[features]
serde = ["dep:serde", "chomp3rs/serde", "dep:rmp-serde", "dep:ndarray-npy"]
rayon = ["chomp3rs/rayon"]
mpi = ["chomp3rs/mpi", "serde"]

[[example]]
name = "generate_python_fixture"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["python"]

[workspace.package]
version = "0.1.0"
authors = ["Travis Casey"]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ndarray = "0.17.2"
rustc-hash = "2.1.3"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
len_without_is_empty = "allow"
needless_pass_by_value = "allow"
neg_cmp_op_on_partial_ord = "allow"
unreadable_literal = "allow"

[dev-dependencies]
tempfile = "3.27.0"
