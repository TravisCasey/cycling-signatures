[package]
name = "cycling-signatures-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for cycling-signatures"
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cycling_signatures = { path = "..", features = ["serde", "rayon"] }
pyo3 = { version = "0.28", features = ["abi3-py311", "extension-module"] }
numpy = "0.28"
rustc-hash = { workspace = true }

[lints]
workspace = true
